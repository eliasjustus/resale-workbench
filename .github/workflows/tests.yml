name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . build "setuptools>=77.0.3" wheel
      - run: python tools/check_candidate.py dist/checked
      - name: Show synthetic CI diagnostics on failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for path in sorted(Path('dist/checked/verification').glob('*.log')):
              print(path.name)
              print(path.read_text(encoding='utf-8', errors='replace'))
